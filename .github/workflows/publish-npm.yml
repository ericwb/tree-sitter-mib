# Adapted from tree-sitter/workflows (MIT, (c) 2024 tree-sitter contributors),
# .github/workflows/package-npm.yml at dca539e07998ac429e185349d3dd194d2c7418d3.
# Changed: takes the release version as an input and writes it into the
# manifests before publishing; parser regeneration is dropped because src/ is
# committed and checked by CI.

name: Publish to npm

on:
  workflow_call:
    inputs:
      version:
        description: The version to publish, without a leading "v"
        required: true
        type: string
      node-version:
        description: The Node.js version
        default: ${{ vars.NODE_VERSION || '24' }}
        type: string
    secrets:
      NODE_AUTH_TOKEN:
        description: An authentication token for npm
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build_wasm:
    name: Build Wasm binary
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: npm ci --omit peer --omit optional
      - name: Build Wasm binary
        run: npm x -- tree-sitter build --wasm
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          path: "*.wasm"
          name: prebuilds-wasm
          retention-days: 2

  build_node:
    name: Build Node.js binary on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - windows-2022
          - windows-11-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-15
          - macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: npm ci --omit peer --omit optional
      - name: Build binary
        run: npm x -- prebuildify -t 20.19.5
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          path: prebuilds/**
          name: prebuilds-${{ matrix.os }}
          retention-days: 2

  publish:
    name: Publish package
    needs: [build_wasm, build_node]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ github.event.repository.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set version
        uses: ./.github/actions/set-version
        with:
          version: ${{ inputs.version }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org/
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          path: prebuilds
          pattern: prebuilds-*
          merge-multiple: true
      - name: List binaries
        run: tree prebuilds
      - name: Move Wasm binary to root
        continue-on-error: true
        run: mv -v prebuilds/*.wasm .
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
