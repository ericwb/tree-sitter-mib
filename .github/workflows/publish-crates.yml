# .github/workflows/package-crates.yml at dca539e07998ac429e185349d3dd194d2c7418d3.
# Changed: takes the release version as an input and writes it into the
# manifests before publishing; parser regeneration is dropped because src/ is
# committed and checked by CI.

name: Publish to crates.io

on:
  workflow_call:
    inputs:
      version:
        description: The version to publish, without a leading "v"
        required: true
        type: string
      rust-toolchain:
        description: The Rust toolchain
        default: ${{ vars.RUST_TOOLCHAIN || 'stable' }}
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: An authentication token for crates.io
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish crate
    runs-on: ubuntu-latest
    environment:
      name: crates
      url: https://crates.io/crates/${{ github.event.repository.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set version
        uses: ./.github/actions/set-version
        with:
          version: ${{ inputs.version }}
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ inputs.rust-toolchain }}
      # The version-stamped manifests are uncommitted changes, which cargo
      # otherwise refuses to publish.
      - name: Publish to crates.io
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
