name: Release

# Runs when a GitHub release is published (Releases > Draft a new release).
# The release's tag is the version: tag v1.2.3 builds and publishes 1.2.3.
# Manifests in the repository stay at the 0.0.0 placeholder; each job writes
# the tag's version into them before building, so nothing has to be bumped or
# committed by hand.
#
# Every release gets a Wasm build and a complete source tarball attached, with
# build-provenance attestations. Publishing to package registries is opt-in per
# registry and is skipped for releases marked as a pre-release. To enable one,
# set the repository variable and add the secret under
# Settings > Secrets and variables > Actions:
#
#   Registry   Variable              Secret
#   npm        PUBLISH_NPM=true      NPM_TOKEN
#   crates.io  PUBLISH_CRATES=true   CARGO_REGISTRY_TOKEN
#   PyPI       PUBLISH_PYPI=true     (none: uses Trusted Publishing)
#
# PyPI Trusted Publishing must be registered on pypi.org for this repository
# with workflow "release.yml" and environment "pypi".

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Read version from tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Parse tag
        id: tag
        shell: bash
        run: |
          if [[ ! $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "Releasing version ${BASH_REMATCH[1]}"
        env:
          TAG: ${{ github.event.release.tag_name }}

  test:
    name: Test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up tree-sitter CLI
        uses: ./.github/actions/setup-cli

      - name: Test parser
        uses: tree-sitter/parser-test-action@v3

  github:
    name: Attach release assets
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set version
        uses: ./.github/actions/set-version
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Build Wasm binary
        run: tree-sitter build --wasm

      # git ls-files lists the tracked files; tar reads them from the working
      # tree, so the archive carries the version-stamped manifests.
      - name: Create source tarball
        run: git ls-files | tar czf "$REPO_NAME-$TAG.tar.gz" --transform "s|^|$REPO_NAME-$TAG/|" -T -

      - name: Generate attestations
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.wasm
            ${{ env.REPO_NAME }}-${{ env.TAG }}.tar.gz

      - name: Upload to release
        run: gh release upload "$TAG" ./*.wasm "$REPO_NAME-$TAG.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    name: npm
    needs: [version, test]
    if: ${{ vars.PUBLISH_NPM == 'true' && !github.event.release.prerelease }}
    uses: ./.github/workflows/publish-npm.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates:
    name: crates.io
    needs: [version, test]
    if: ${{ vars.PUBLISH_CRATES == 'true' && !github.event.release.prerelease }}
    uses: ./.github/workflows/publish-crates.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python:
    name: Python distributions
    needs: [version, test]
    if: ${{ vars.PUBLISH_PYPI == 'true' && !github.event.release.prerelease }}
    uses: ./.github/workflows/build-python.yml
    with:
      version: ${{ needs.version.outputs.version }}

  # This job must stay in release.yml: PyPI Trusted Publishing identifies the
  # publisher by the top-level workflow file and does not accept a reusable
  # workflow.
  pypi:
    name: Publish to PyPI
    needs: python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/${{ github.event.repository.name }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: List distributions
        run: ls -l dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
