name: Set up pinned tree-sitter CLI
description: >-
  Install the tree-sitter CLI version pinned as "tree-sitter-cli" in
  package.json, so local development, CI and releases all use the same one.

runs:
  using: composite
  steps:
    - name: Read pinned CLI version
      id: pin
      shell: bash
      run: |
        version=$(jq -r '.devDependencies["tree-sitter-cli"]' package.json)
        if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=package.json::tree-sitter-cli must be pinned to an exact version, found '$version'"
          exit 1
        fi
        echo "ref=v$version" >> "$GITHUB_OUTPUT"

    - name: Set up tree-sitter CLI
      uses: tree-sitter/setup-action/cli@v2
      with:
        tree-sitter-ref: ${{ steps.pin.outputs.ref }}
